<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>VELOCITY X</title>
<link rel="icon" href="web/img/icon-1024.png">
<meta http-equiv="refresh" content="0;url=web/index.html">
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center; gap: 18px; text-align: center;
    background: radial-gradient(120% 90% at 50% 0%, #0d2233 0%, #05080f 62%);
    color: #d9fbff; font: 500 15px/1.5 Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  }
  b { display: block; font-size: 26px; letter-spacing: .22em; margin-bottom: 4px; }
  b i { color: #00e5ff; font-style: normal; }
  small { display: block; color: #7ea8bd; letter-spacing: .28em; font-size: 11px; }
  a {
    display: inline-block; margin-top: 14px; padding: 12px 24px; border-radius: 4px;
    background: #00e5ff; color: #04121a; text-decoration: none;
    font-weight: 700; letter-spacing: .16em; font-size: 13px;
  }
  .bar { width: 180px; height: 2px; margin: 10px auto 0; background: #123243; overflow: hidden; }
  .bar span { display: block; height: 100%; width: 40%; background: #00e5ff; animation: load 1.1s linear infinite; }
  @keyframes load { from { transform: translateX(-100%) } to { transform: translateX(350%) } }
  @media (prefers-reduced-motion: reduce) { .bar span { animation: none; width: 100% } }
</style>
<script>location.replace('web/index.html');</script>
</head>
<body>
  <div>
    <b>VELOCITY <i>X</i></b>
    <small>LOADING THE GAME</small>
    <div class="bar"><span></span></div>
    <a href="web/index.html">START ENGINE</a>
  </div>
</body>
</html>
