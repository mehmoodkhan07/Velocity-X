<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-label="VELOCITY X — drive beyond limits">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04060a"/>
      <stop offset=".45" stop-color="#0a1220"/>
      <stop offset="1" stop-color="#04060a"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset=".55" stop-color="#7CF7FF"/>
      <stop offset="1" stop-color="#00FFA3"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00E5FF" stop-opacity=".55"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="car" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#0affc3"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <style>
      .grid { animation: fade 4s ease-in-out infinite; }
      .streak { animation: fly 2.4s linear infinite; opacity: 0; }
      .s1 { animation-delay: 0s } .s2 { animation-delay: .25s } .s3 { animation-delay: .5s }
      .s4 { animation-delay: .8s } .s5 { animation-delay: 1.1s } .s6 { animation-delay: 1.45s }
      .s7 { animation-delay: 1.75s } .s8 { animation-delay: 2.05s }
      .car { animation: bob 1.6s ease-in-out infinite; }
      .title { animation: pulse 3.2s ease-in-out infinite; }
      .sub { animation: rise 1.4s ease-out both; }
      .dot { animation: blink 2s ease-in-out infinite; }
      @keyframes fade { 0%,100% { opacity: .35 } 50% { opacity: .8 } }
      @keyframes fly { 0% { transform: translateX(0); opacity: 0 } 10% { opacity: .9 } 85% { opacity: .5 } 100% { transform: translateX(520px); opacity: 0 } }
      @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-3px) } }
      @keyframes pulse { 0%,100% { opacity: .92 } 50% { opacity: 1 } }
      @keyframes rise { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: translateY(0) } }
      @keyframes blink { 0%,100% { opacity: .2 } 50% { opacity: 1 } }
      @media (prefers-reduced-motion: reduce) { .streak, .car, .title, .grid, .sub, .dot { animation: none } }
    </style>
  </defs>

  <rect width="1280" height="340" fill="url(#bg)"/>

  <!-- horizon glow -->
  <ellipse cx="640" cy="252" rx="520" ry="60" fill="#00E5FF" opacity=".14" filter="url(#soft)"/>

  <!-- perspective grid -->
  <g class="grid" stroke="#0e3b52" stroke-width="1" opacity=".5">
    <path d="M0 205 H1280"/>
    <path d="M0 218 H1280"/><path d="M0 236 H1280"/><path d="M0 262 H1280"/><path d="M0 300 H1280"/>
    <path d="M640 205 L640 340"/><path d="M574 205 L420 340"/><path d="M706 205 L860 340"/>
    <path d="M508 205 L200 340"/><path d="M772 205 L1080 340"/>
  </g>
  <rect y="200" width="1280" height="6" fill="url(#road)"/>

  <!-- speed streaks -->
  <g fill="#00E5FF" opacity=".85">
    <rect class="streak s1" x="150" y="150" width="90" height="2" rx="1"/>
    <rect class="streak s2" x="120" y="176" width="140" height="2" rx="1"/>
    <rect class="streak s3" x="210" y="198" width="70" height="2" rx="1"/>
    <rect class="streak s4" x="90" y="214" width="120" height="2" rx="1"/>
    <rect class="streak s5" x="260" y="132" width="60" height="2" rx="1"/>
    <rect class="streak s6" x="60" y="164" width="100" height="2" rx="1"/>
    <rect class="streak s7" x="330" y="186" width="80" height="2" rx="1"/>
    <rect class="streak s8" x="180" y="126" width="50" height="2" rx="1"/>
  </g>

  <!-- car, sliding with the streaks -->
  <g class="car" transform="translate(560 176)">
    <g transform="translate(0 -18)">
      <path d="M4 26 q6 -16 30 -18 l26 -1 q10 -10 26 -10 l30 0 q14 0 20 11 l24 3 q18 3 20 15 l0 8 -188 0 z"
            fill="url(#car)" opacity=".95" filter="url(#glow)"/>
      <path d="M70 8 q8 -7 20 -7 l26 0 q10 0 15 7 z" fill="#04060a" opacity=".55"/>
      <circle cx="46" cy="34" r="13" fill="#04060a" stroke="#00E5FF" stroke-width="2.5"/>
      <circle cx="152" cy="34" r="13" fill="#04060a" stroke="#00E5FF" stroke-width="2.5"/>
      <rect x="178" y="14" width="10" height="4" rx="2" fill="#eaffff" opacity=".9"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="640" y="112" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="86" font-weight="800" letter-spacing="10" fill="url(#title)" filter="url(#glow)" class="title">VELOCITY X</text>
  <text x="640" y="146" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="17" letter-spacing="9" fill="#8fe9ff" opacity=".85" class="sub">D R I V E   B E Y O N D   L I M I T S</text>

  <!-- chips -->
  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="1.2">
    <g transform="translate(341 252)">
      <rect width="190" height="28" rx="14" fill="#08111c" stroke="#00E5FF55"/>
      <circle cx="17" cy="14" r="4" fill="#00FFA3" class="dot"/>
      <text x="30" y="19" fill="#9defff">12 CARS · 6 MODES</text>
    </g>
    <g transform="translate(545 252)">
      <rect width="150" height="28" rx="14" fill="#08111c" stroke="#00E5FF55"/>
      <text x="17" y="19" fill="#9defff">WEB + DESKTOP</text>
    </g>
    <g transform="translate(709 252)">
      <rect width="230" height="28" rx="14" fill="#08111c" stroke="#00E5FF55"/>
      <text x="17" y="19" fill="#9defff">KEYBOARD · PAD · TOUCH</text>
    </g>
  </g>
</svg>
